device: null
seed: 17
add_sino_noise: true
snr_db: 40
# snr_db: 10000

model: 
  sim_n_gaussians: 4
  reco_n_gaussians: 4

geometry:
  sources:
    - [-1.0, -1.0]
  receivers:
    n_receivers: 256
    x_coordinate: 4.0
    y_min: -3.0
    y_max: 1.0

physics:
  initial_positions:
    - [1.0, 1.0]
  initial_accelerations:
    - [0.0, -9.81]

  omega_range: [1.0, 3.0]
  n_projections: 150
  duration: 2.0
  initial_velocities: [0.1, 0.25]

reconstruction:
  max_iterations: 5000
  tolerance: 1e-5

output:
  directory: "data/"
  save_plots: true
  save_animations: true
  verbose: true

analysis:
  enabled: true
  skip_errors: false
  skip_plots: false
  skip_animations: false

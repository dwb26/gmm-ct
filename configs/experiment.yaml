device: null
seed: 2
add_sino_noise: true
# snr_db: 20000
snr_db: 15
# snr_db: 20
# snr_db: 10

model: 
  sim_n_gaussians: 1
  reco_n_gaussians: 1

geometry:
  sources:
    - [-1.0, -1.0]
  receivers:
    n_receivers: 256
    x_coordinate: 4.0
    y_min: -3.0
    y_max: 1.0

physics:
  initial_positions:
    - [1.0, 1.0]
  initial_accelerations:
    - [0.0, -9.81]
  omega_range: [2.0, 4.0]
  n_projections: 16
  duration: 2.0

reconstruction:
  max_iterations: 5000
  tolerance: 1e-5

output:
  directory: "data/"
  save_plots: true
  save_animations: true
  verbose: true

analysis:
  enabled: true
  skip_errors: false
  skip_plots: false
  skip_animations: false
